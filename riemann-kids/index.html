let cur = 0, flip = false;
const N = PAGES.length;
const book = document.getElementById('book');

function rC(){
  const pages = document.querySelectorAll('.page');
  pages.forEach((p,i)=>p.classList.toggle('on', i===cur));
  document.querySelectorAll('.indicator span').forEach((s,i)=>s.classList.toggle('on', i===cur));

}
function hA(){document.querySelectorAll('.page').forEach(p=>{p.style.opacity=0;});}
function sP(i,z,cls){const p=document.getElementById('page-'+i);if(!p)return;p.style.opacity=1;p.style.zIndex=z;p.classList.add(cls);}
function doFlip(dst,dir){
  if(flip||dst<0||dst>=N)return;
  const t=dst>cur?cur:dst;
  flip=true;hA();
  sP(dst,1,'page-underneath');
  if(dir<0)sP(cur,2,'page-current');
  const sh=document.createElement('div');sh.className='curl-shadow';
  if(dir>0)sh.style.cssText='background:linear-gradient(to right,rgba(0,0,0,.6) 0%,transparent 30%)';
  else sh.style.cssText='background:linear-gradient(to left,rgba(0,0,0,.6) 0%,transparent 30%)';
  book.appendChild(sh);
  const fl=document.createElement('div');fl.className='page-flipper';
  if(dir<0)fl.style.transform='perspective(2200px) rotateY(-180deg)';
  const fr=document.createElement('div');fr.className='page-flipper';
  fr.style.cssText='left:50%;transform-origin:right center;z-index:3';
  fr.style.transform='perspective(2200px) rotateY(0deg)';
  book.appendChild(fl);book.appendChild(fr);
  setTimeout(()=>{fl.style.transform='perspective(2200px) rotateY(-180deg)';fr.style.transform='perspective(2200px) rotateY(180deg)';},30);
  const done=()=>{[sh,fl,fr].forEach(el=>el.remove());flip=false;cur=dst;rC();};
  fl.addEventListener('transitionend',function h(){fl.removeEventListener('transitionend',h);done()});
  setTimeout(done,1200);
}
function next(){doFlip(cur+1,1)}
function prev(){doFlip(cur-1,-1)}

/* ═══════════ 工具 ═══════════ */
function isPrime(n){
  if(n<2)return false;
  if(n%2===0)return n===2;
  for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;
  return true;
}
function sieve(n){
  const a=new Uint8Array(n+1).fill(1);a[0]=a[1]=0;
  for(let i=2;i*i<=n;i++)if(a[i])for(let j=i*i;j<=n;j+=i)a[j]=0;
  return a;
}

/* ═══════════ 乌拉姆螺旋 ═══════════ */
const spiralCanvas=document.getElementById('spiralCanvas');
const spiralCtx=spiralCanvas.getContext('2d');
function drawSpiral(n){
  const canvas=spiralCanvas;
  const dpr=window.devicePixelRatio||1;
  const size=Math.min(canvas.parentElement.clientWidth-8,380);
  canvas.style.width=size+'px';canvas.style.height=size+'px';
  canvas.width=size*dpr;canvas.height=size*dpr;
  const ctx=spiralCtx;ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,size,size);
  const cell=size/n;
  const primes=sieve(n*n);
  let x=Math.floor(n/2),y=Math.floor(n/2),dir=0,step=1,turn=0,drawn=0;
  const dx=[1,0,-1,0],dy=[0,1,0,-1];
  for(let v=1;v<=n*n;v++){
    const px=x*cell,py=y*cell;
    ctx.fillStyle=primes[v]?'#e8b84b':'#1e2a44';
    ctx.globalAlpha=primes[v]?0.95:0.35;
    ctx.fillRect(px,py,cell+0.5,cell+0.5);
    if(primes[v])drawn++;
    x+=dx[dir];y+=dy[dir];turn++;
    if(turn===step){dir=(dir+1)%4;turn=0;if(dir%2===0)step++;}
  }
  ctx.globalAlpha=1;
  document.getElementById('spiralResult').innerHTML='边长 '+n+' 里有 <span class="ok">'+drawn+' 个素数</span>（占比 '+(100*drawn/(n*n)).toFixed(1)+'%）。看对角线上的金色聚集。';
}
document.getElementById('spiralSize').addEventListener('input',function(){
  const v=+this.value;
  document.getElementById('spiralLabel').textContent=v+' × '+v;
  drawSpiral(v);
});

const gameBtn=document.getElementById('gameBtn');

const gameGuess=document.getElementById('gameGuess');
const gameResult=document.getElementById('gameResult');
const gameSteps=document.getElementById('gameSteps');
let guessed=false;
gameGuess.addEventListener('click',()=>{
  const n=+gameInput.value;
  if(!n||n<2||n>5000){gameGuess.textContent='输入 2-5000 的数';return;}
  gameGuess.textContent=isPrime(n)?'我赌它是素数 💪':'我赌它不是素数 🤔';
  guessed=true;
});
gameBtn.addEventListener('click',()=>{
  const n=+gameInput.value;
  if(!n||n<2||n>5000){gameResult.innerHTML='<span class="no">请输入 2 到 5000 之间的数</span>';return;}
  gameBtn.disabled=true;
  gameResult.innerHTML='';
  gameSteps.textContent='';
  let i=2;
  const step=()=>{
    if(i*i>n){
      gameResult.innerHTML='<span class="ok">✅ '+n+' 是素数！</span>'+(guessed?'（你猜对了吗？）':'');
      gameSteps.textContent='试除了 2 到 √'+n+' 的所有整数，没有一个能整除 '+n+'。';
      gameBtn.disabled=false;return;
    }
    if(n%i===0){
      gameResult.innerHTML='<span class="no">❌ '+n+' 不是素数：'+i+' × '+(n/i)+' = '+n+'</span>'+(guessed?'（你猜对了吗？）':'');
      gameSteps.textContent='试除到 '+i+' 时命中：'+n+' 能被 '+i+' 整除。';
      gameBtn.disabled=false;return;
    }
    if(i===2){gameSteps.textContent='试除 2：'+n+' % 2 = '+n%2+'，不整除';}
    else{gameSteps.textContent+='\n试除 '+i+'：'+n+' % '+i+' = '+n%i+'，不整除';}
    i=(i===2)?3:i+2;
    setTimeout(step,180);
  };
  step();
});
